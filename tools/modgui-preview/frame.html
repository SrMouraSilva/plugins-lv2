<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The stylesheets and scripts MOD UI itself loads -->
<link rel="stylesheet" href="/modui/css/fontello/css/fontello.css">
<link rel="stylesheet" href="/modui/css/main.css">
<link rel="stylesheet" href="/modui/css/dashboard.css">
<link rel="stylesheet" href="/modui/css/fonts.css">
<link rel="stylesheet" href="/modui/img/icons/icons.css">
<link rel="stylesheet" href="/modui/css/pedals.css">
<link rel="stylesheet" href="/modui/resources/pedals/default.css">
<script src="/modui/js/lib/jquery-1.9.1.min.js"></script>
<script src="/modui/js/lib/mustache.js"></script>
<style>body { margin: 0; background: #1f1f1f; }</style>
</head>
<body>
<div id="pedalboard-dashboard" style="position: relative; padding: 70px 40px 40px 40px;"></div>
<script>
/*
 * A stand-in for what modgui.js (MOD UI) does with a plugin: it renders the icon and settings templates with
 * Mustache, loads the stylesheet, and runs the plugin javascript with the same events and functions.
 * There is no plugin behind it: ports and parameters only hold the values it is given (their defaults, the ones
 * of a factory preset, or what the page around it sends), and what the interface asks the plugin to do is
 * logged in window.__log.
 *
 * Query:  plugin=NAME   view=icon|settings|shot (the icon alone, for screenshots; jacks=1 keeps the jacks)
 *          preset=INDEX   addressed=Symbol,Symbol   click=CSS selector
 *          latency=MS (delay of the simulated host, 150)   simulate=0 (no simulated host)
 * Outside: window.send(event) sends an event to the plugin javascript, window.portValues holds the ports.
 */
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'icon';
const log = (...a) => (window.__log = window.__log || []).push(a);
const get = (plugin, file) => fetch(`/plugin/${plugin}/${file}`).then((r) => r.text());

fetch('/api/plugin/' + q.get('plugin')).then((r) => r.json()).then(async (model) => {
  if (model.error) { document.body.textContent = model.error; return; }

  const preset = q.get('preset') === null || q.get('preset') === '' ? null : model.presets[Number(q.get('preset'))];
  const [css, iconTemplate, settingsTemplate, js] = await Promise.all([
    get(model.name, model.gui.stylesheet), get(model.name, model.gui.iconTemplate),
    model.gui.settingsTemplate ? get(model.name, model.gui.settingsTemplate) : '', get(model.name, model.gui.javascript),
  ]);

  const effect = { name: model.title, label: model.label, brand: model.brand, color: model.color, ports: model.ports, parameters: model.parameters };
  const templateData = { effect, brand: model.brand, label: model.label, color: model.color, ns: '', cns: '_x' };
  $('<style>').text(Mustache.render(css, templateData)).appendTo('head');

  // Values of the ports and of the parameters (the state): defaults, then the factory preset
  const portValues = window.portValues = {};
  [...model.ports.control.input, ...model.ports.control.output].forEach((p) => portValues[p.symbol] = p.default);
  const parameterValues = Object.assign({}, model.state);
  if (preset) { Object.assign(portValues, preset.ports); Object.assign(parameterValues, preset.state); }

  const icon = $('<div class="mod-pedal" mod-instance="/graph/plugin">').html(Mustache.render(iconTemplate, templateData));
  const settings = $('<div class="mod-settings" mod-instance="/graph/plugin">');

  // What MOD UI adds around every plugin icon, and to its ports
  const actions = $('<div class="mod-actions">').appendTo(icon);
  $('<div class="mod-settings">').click(() => { settings.css('z-index', 1000).show(); }).appendTo(actions);
  icon.find('[mod-role$="-port"]').each(function () {
    const [, direction, type] = $(this).attr('mod-role').match(/^(input|output)-(\w+)-port$/) || [];
    if (!direction) return;
    $(this).addClass(`mod-${direction} mod-${type}-${direction} ${direction}-disconnected`);
    if (direction === 'output') $('<div class="mod-output-jack jack-disconnected">').appendTo(this);
  });
  icon.css({ position: 'absolute', left: 40, top: 70, 'z-index': 30 }).appendTo('#pedalboard-dashboard');

  if (model.gui.settingsTemplate) {
    settings.html(Mustache.render(settingsTemplate, Object.assign({
      presets: { factory: model.presets.map((p, i) => ({ uri: 'preset' + i, label: p.label })), user: [{ uri: 'user0', label: 'A user preset', path: '/p' }] },
    }, templateData)));
  }
  settings.appendTo('body').find('.js-close').click(() => { settings.hide(); return false; });

  if (view === 'settings' && model.gui.settingsTemplate) { settings.css('z-index', 1000); } else { settings.hide(); }
  if (view === 'shot') {
    $('html, body, #pedalboard-dashboard').css({ background: 'transparent', padding: 0 });
    icon.css({ position: 'fixed', left: 20, top: 20 }).find(q.get('jacks') ? '.mod-actions' : '.mod-actions, .mod-pedal-output, .mod-pedal-input').hide();
  }

  let method; eval('method = ' + js);
  const data = {};
  // A stand-in for MOD UI + the plugin, for plugins that select one preset at a time with `Preset_selector_N` ports
  // (latency=MS delays the host's answer, 150 by default; simulate=0 turns it off):
  //  - MOD UI sends nothing when the port already has that value (setPortValue: `port.value == value`), and the
  //    value only goes back when the host's answer arrives
  //  - the plugin then turns the previous selector off, the new one on, and moves `Preset_combobox`. Like mod-host,
  //    the answer leaves out the port the change came through: the host already holds that value
  //    (RequestControlPortChange ignores a request for the value the port has), so it sends nothing for it
  const latency = Number(q.get('latency') === null ? 150 : q.get('latency'));
  const simulate = q.get('simulate') !== '0' && 'Preset_selector_1' in portValues;
  let hostPreset = 1;
  while (hostPreset < 64 && portValues['Preset_selector_' + hostPreset] !== 1) hostPreset++;
  // through: the symbol the change came in by (nothing for a change from outside: a footswitch, MIDI)
  const hostSelects = (preset, through) => {
    const previous = hostPreset;
    hostPreset = preset;
    const answer = (symbol, value) => symbol !== through && send({ type: 'change', symbol, value });
    if (previous !== preset) answer('Preset_selector_' + previous, 0);
    answer('Preset_selector_' + preset, 1);
    if (previous !== preset) answer('Preset_combobox', preset - 1);
    // A monitored output (Hept7 Switch): the host reports it whenever it changes
    if (previous !== preset && 'Active_preset' in portValues) send({ type: 'change', symbol: 'Active_preset', value: preset - 1 });
  };
  window.hostSelects = (preset) => hostSelects(preset);   // what a MIDI controller does
  window.simPreset = () => hostPreset;                    // where the simulated plugin is

  const funcs = {
    set_port_value: (symbol, value) => {
      if (portValues[symbol] == value) { log('dropped by MOD UI (same value)', symbol, value); return; }
      portValues[symbol] = value;
      log('set_port_value', symbol, value);
      parent.portChanged && parent.portChanged(symbol, value);
      const selector = /^Preset_selector_(\d+)$/.exec(symbol);
      if (simulate && selector && value == 1) setTimeout(() => hostSelects(Number(selector[1]), symbol), latency);
      if (simulate && symbol === 'Preset_combobox') setTimeout(() => hostSelects(Math.round(value) + 1, symbol), latency);
    },
    // The plugin answers a patch:Get with a 'change' event that has a uri
    patch_get: (uri) => { log('patch_get', uri); setTimeout(() => send({ type: 'change', uri, value: parameterValues[uri] }), 0); },
    patch_set: (uri, type, value) => { parameterValues[uri] = value; log('patch_set', uri, type, value); },
    get_custom_resource_filename: (file) => `/plugin/${model.name}/${file}`,
    get_port_index_for_symbol: (s) => ([...model.ports.control.input, ...model.ports.control.output].find((p) => p.symbol === s) || { index: -1 }).index,
  };
  const send = window.send = (event) => {
    if (event.symbol !== undefined) portValues[event.symbol] = event.value;
    method(Object.assign({ data, icon, settings, api_version: 3 }, event), funcs);
  };

  const ports = [{ symbol: ':bypass', value: 0 }, ...[...model.ports.control.input, ...model.ports.control.output].map((p) => ({ symbol: p.symbol, value: portValues[p.symbol] }))];
  send({ type: 'start', ports, parameters: Object.entries(parameterValues).map(([uri, value]) => ({ uri, value })) });

  (q.get('addressed') || '').split(',').filter(Boolean).forEach((s) => settings.find(`.mod-address[mod-port-symbol=${s}]`).addClass('addressed'));
  if (q.get('click')) $(q.get('click')).click();
  // Whatever is meant to be clicked must not be covered by something else. MOD UI puts a drag handle over the
  // whole icon (z-index 20): controls need position: relative and a higher z-index, or they cannot be clicked.
  const covered = (root) => [...root.querySelectorAll('button, input, select, a, [role=switch]')].filter((el) => {
    const r = el.getBoundingClientRect();
    const style = getComputedStyle(el);
    // Not checked: invisible by design (a hidden radio/checkbox behind its label) or disabled
    if (!r.width || !r.height || style.visibility === 'hidden' || style.opacity === '0' || el.disabled) return false;
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    if (x < 0 || y < 0 || x > innerWidth || y > innerHeight) return false;   // scrolled out: not checked
    const hit = document.elementFromPoint(x, y);
    return hit !== el && !el.contains(hit) && !(hit && hit.contains(el));
  });
  window.checkClickable = () => {
    const root = (view === 'settings' ? settings : icon)[0];
    const bad = $(root).is(':visible') ? covered(root) : [];
    $('#hit-warning').remove();
    if (bad.length) {
      $('<div id="hit-warning">').css({ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 99999, background: '#b00020', color: '#fff', font: '13px system-ui', padding: '8px 12px' })
        .text(`${bad.length} control(s) cannot be clicked, something covers them: ` + bad.slice(0, 4).map((e) => (e.className || e.tagName) + ' (under ' + (document.elementFromPoint(e.getBoundingClientRect().left + e.getBoundingClientRect().width / 2, e.getBoundingClientRect().top + e.getBoundingClientRect().height / 2).className || '?') + ')').join(', '))
        .appendTo('body');
    }
    return bad.length;
  };
  setTimeout(window.checkClickable, 300);
  window.ready = true;
  parent.frameReady && parent.frameReady(model);
});
</script>
</body>
</html>

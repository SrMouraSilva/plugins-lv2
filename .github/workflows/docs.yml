name: Documentation site

# Builds the documentation site (tools/site/build_site.py): the landing page, the user manual of each plugin and the
# guides for developers, and publishes it on GitHub Pages.
#
#   https://<owner>.github.io/<repository>/   e.g. https://srmourasilva.github.io/plugins-lv2/
#
# One-time setup, in the repository settings:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Settings > Environments > github-pages > Deployment branches: allow the branches listed below (GitHub only
#      allows the default branch at first, and the deploy job is refused on any other until it is added)
#
# It is published by release.yml (job `site`, from the main branch only, on every push or run by hand: the install links
# are made there and come in the artifact `installs`), which calls this workflow. The main branch is set in the job `version` of
# release.yml (a TODO there: the development branch for now; remove it from the allowed branches of the environment when it is merged).
on:
  workflow_call:
  pull_request:                 # only builds: a broken manual or guide is caught before merging

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that has not finished. The builds of pull requests have a group of
# their own: with a shared one, the run of a merged pull request (which starts a few seconds after the push) cancelled
# the push run, and the site was never deployed.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the tools
        run: pip install markdown pillow

      # The "Install on my MOD" links, made by release.yml (tools/store/cloud_build.py); absent on a pull request, which builds without them
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: installs
          path: installs

      - name: Build the site
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: python3 tools/site/build_site.py --out _site $(test -f installs/installs.json && echo "--installs installs/installs.json") --repo "$GITHUB_REPOSITORY" --ref "$REF"

      - name: List what was built
        run: find _site -type f | sort | xargs ls -la | awk '{print $5, $9}'

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

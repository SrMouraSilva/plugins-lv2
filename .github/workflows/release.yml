name: Build and release

# Every push to a branch builds the bundles for MOD Duo, Duo X and Dwarf and
# publishes a single release named after the commit: <date>-<branch>-<hash>
# (e.g. 20261113-1530-master-87a3e32).
# Pull requests only build, so broken builds are caught before merging.
#
# It also builds the plugins for the computer, for MOD Desktop (macOS, Windows, Linux: job `desktop`, tools/desktop/package.py), and
# the release has those archives next to the ones of the units. The release does not wait for the MOD Cloud Builder: it is published
# when the bundles are built (a minute or two) and the links are added to its notes afterwards (job `links`).
#
# The release also carries the "Install on my MOD" links: the plugins are built on the MOD Cloud Builder (tools/store/cloud_build.py),
# which keeps the build and gives the page that installs it on a unit. Each build stays on that server, so it is made
#   - on every push to the main branch (MAIN_BRANCH below), and the documentation site (docs.yml) is published with those links;
#   - on any other branch only when started by hand: Actions > Build and release > Run workflow, pick the branch (cloud_build on),
#     to give a test version to somebody. The release of every other push has the bundles only.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      cloud_build:
        description: 'Build on the MOD Cloud Builder and put the install links in the release'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINS: gossiper tetr4-switch hept7-switch kill-switch

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      branch: ${{ steps.v.outputs.branch }}
      sha: ${{ steps.v.outputs.sha }}
      date: ${{ steps.v.outputs.date }}
      main: ${{ steps.v.outputs.main }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        id: v
        env:
          TZ: UTC
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          branch="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9._\n-' '-' | sed 's/^-*//; s/-*$//')"
          sha="$(git rev-parse --short=7 HEAD)"
          date="$(git log -1 --format=%cd --date=format-local:'%Y%m%d-%H%M')"
          # TODO: the main branch is the development branch for now. When it is merged, set it to main.
          MAIN_BRANCH=feature/hept7-switch
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$MAIN_BRANCH" ]; then echo "main=true" >> "$GITHUB_OUTPUT"; else echo "main=false" >> "$GITHUB_OUTPUT"; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$date-$branch-$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # device: name used on the release assets
          # platform: mod-plugin-builder platform (also the cbix/mod-plugin-builder image tag)
          # home: home of the user the image runs as (the Duo/Duo X images use `builder`, the Dwarf one root)
          - { device: duo, platform: modduo, home: /home/builder }
          - { device: duo x, platform: modduox, home: /home/builder }
          - { device: dwarf, platform: moddwarf, home: /root }
    steps:
      - uses: actions/checkout@v7

      - name: Build for ${{ matrix.device }}
        run: |
          # The Duo/Duo X images run as a non-root user, which must be able to write to /out
          mkdir -p out && chmod 777 out
          docker run --rm \
            -v "$PWD/plugins:${{ matrix.home }}/mod-plugin-builder/plugins/package/srmourasilva-plugins" \
            -v "$PWD/out:/out" \
            "cbix/mod-plugin-builder:${{ matrix.platform }}" bash -euxc '
              # `build` needs ping to reach a device, which is not needed here
              SUDO=$(test "$(id -u)" = 0 || echo sudo)
              printf "#!/bin/bash\nexit 0\n" | $SUDO tee /usr/bin/ping >/dev/null
              $SUDO chmod +x /usr/bin/ping
              ./build ${{ matrix.platform }} srmourasilva-plugins
              cp -r "$HOME/mod-workdir/${{ matrix.platform }}/target/usr/local/lib/lv2/"*.lv2 /out/
            '

      - name: Package bundles
        run: |
          mkdir -p dist
          for plugin in $PLUGINS; do
            test -f "out/$plugin.lv2/$plugin.so"
            tar -czf "dist/$plugin-${{ matrix.device }}.lv2.tar.gz" -C out "$plugin.lv2"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.device }}
          path: dist/*.tar.gz

  # The plugins for the computer, for MOD Desktop: a native binary of each system (a unit's is ARM Linux, which it cannot load), packed by
  # tools/desktop/package.py into <plugin>-<system>.lv2.zip. A failure here does not stop the release of the units.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: macos, runner: macos-latest }
          - { system: windows, runner: windows-latest }
          # the oldest runner there is: a binary asks for the glibc of the machine that built it, and the oldest one runs everywhere
          - { system: linux, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build for Linux
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lv2-dev
          make -C plugins build

      # Universal (Apple Silicon and Intel) and for macOS 10.15 on, as MOD Desktop is
      - name: Build for macOS
        if: matrix.system == 'macos'
        run: |
          brew install lv2
          make -C plugins build MACOS=true BINARY_EXT=.dylib \
            CFLAGS="-I$(brew --prefix)/include -arch arm64 -arch x86_64 -mmacosx-version-min=10.15" \
            LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=10.15"

      # 64 bits, with the C runtime of the system only (no DLL of ours to ship)
      - uses: msys2/setup-msys2@v2
        if: matrix.system == 'windows'
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-lv2

      - name: Build for Windows
        if: matrix.system == 'windows'
        shell: msys2 {0}
        run: make -C plugins build CC=gcc WIN32=true BINARY_EXT=.dll LDFLAGS="-static-libgcc"

      - name: Package
        run: python tools/desktop/package.py ${{ matrix.system }} --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-desktop-${{ matrix.system }}
          path: dist/*.zip

  # The install pages of the MOD Cloud Builder (see the top). Its failure never stops the release or the site: they go without the links.
  cloud:
    needs: version
    # TODO: TESTING, so it builds on every push. Restore the line below (main branch, or started by hand) when done:
    # if: github.event_name != 'pull_request' && (needs.version.outputs.main == 'true' || (github.event_name == 'workflow_dispatch' && inputs.cloud_build))
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What the builder builds is the plugins/ and store/ of the commit (not the docs): when none of them changed, the links of the last
      # build are still good, and a push of only documentation costs no build (and no space on the builder). The cache has the links of a
      # build that succeeded only (below), and it is the one of this branch or of the default one: elsewhere it is built again.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: installs.json
          key: cloud-installs-${{ hashFiles('plugins/**', '!plugins/resources/*/docs/**', 'store/**', 'tools/store/cloud_build.py') }}

      - uses: actions/setup-python@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install "python-socketio[client]"

      - name: Build the plugins on the MOD Cloud Builder
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 tools/store/cloud_build.py all --commit "$GITHUB_SHA" --output installs.json

      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        with:
          path: installs.json
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: installs
          path: installs.json
          if-no-files-found: ignore

  release:
    # `desktop` is waited for but not required: a failure of a build for the computer leaves its files out
    needs: [version, build, desktop]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          BRANCH: ${{ needs.version.outputs.branch }}
          SHA: ${{ needs.version.outputs.sha }}
          DATE: ${{ needs.version.outputs.date }}
        run: |
          # Only the default branch is a regular release ("Latest");
          # other branches are pre-releases so they never replace it.
          flags="--prerelease"
          if [ "$BRANCH" = "${{ github.event.repository.default_branch }}" ]; then
            flags="--latest"
          fi

          cat > notes.md <<NOTES
          Bundles for **MOD Duo**, **MOD Duo X** and **MOD Dwarf**
          (\`<plugin>-duo\`, \`<plugin>-duo-x\` and \`<plugin>-dwarf\`).

          | | |
          |---|---|
          | Branch | \`$BRANCH\` |
          | Commit | [\`$SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | Commit date | $DATE UTC |
          NOTES

          if ls dist/*.lv2.zip >/dev/null 2>&1; then
            cat >> notes.md <<NOTES

          For **MOD Desktop**: \`<plugin>-macos\` (Apple Silicon and Intel), \`<plugin>-windows\` and \`<plugin>-linux\` (\`.lv2.zip\`).
          Unzip the folder into \`Documents/MOD Desktop/lv2/\` and press Stop and Start in MOD Desktop. On macOS, run
          \`xattr -cr <plugin>.lv2\` on it first (MOD Desktop 0.14.2 or later).
          NOTES
          fi

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$BRANCH @ $SHA ($DATE UTC)" \
            --notes-file notes.md \
            $flags

  # The install pages are made while (or after) the release is published: they are added to its notes when they are ready
  links:
    needs: [version, release, cloud]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.cloud.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the release
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true       # no links: the builder failed
        with:
          name: installs
          path: installs

      - name: Add the links to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          test -s installs/installs.json || { echo "no links to add"; exit 0; }
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            printf '\n### Install on a MOD unit\n\n'
            printf 'Plug the unit into the computer with the USB cable and open the page of the plugin (builds kept by the [MOD Cloud Builder](https://builder.mod.audio)):\n\n'
            python3 -c "import json; [print(f'- [{name}]({url})') for name, url in sorted(json.load(open('installs/installs.json')).items())]"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  # The documentation site, with the install links, from the main branch only (docs.yml builds it; it deploys to GitHub Pages)
  site:
    needs: [version, cloud]
    # TODO: TESTING, the site is not published for now. Restore the line below when done:
    # if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.version.outputs.main == 'true' }}
    if: ${{ needs.version.outputs.main == 'testing-no-site' }}   # never true
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

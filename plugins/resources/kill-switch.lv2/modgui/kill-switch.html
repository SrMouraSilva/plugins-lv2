<div class="mod-pedal kill-switch-base mod-no-shadow">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="kill-switch is-bypassed">
      <div class="ks-main">
        <div class="ks-head">
          <span class="ks-brand">Kill Switch</span>
          <span class="ks-state" aria-live="polite">Bypassed</span>
        </div>

        <!-- The pattern: its name, the buttons that change it and its steps (lit = the signal passes, dark = it is cut) -->
        <div class="ks-display">
          <div class="ks-pattern">
            <button type="button" class="ks-step-button ks-prev" aria-label="Previous pattern" title="Previous pattern"><span aria-hidden="true">&#9664;</span></button>
            <div class="ks-pattern-name" aria-live="polite">Chop 8ths</div>
            <button type="button" class="ks-step-button ks-next" aria-label="Next pattern" title="Next pattern"><span aria-hidden="true">&#9654;</span></button>
          </div>
          <div class="ks-steps" role="img" aria-label="The steps of the pattern"></div>
        </div>

        <div class="ks-controls">
          <div class="ks-control ks-tempo">
            <span class="ks-label">Tempo</span>
            <div class="ks-stepper">
              <button type="button" class="ks-step-button ks-bpm-down" aria-label="Slower" title="Slower"><span aria-hidden="true">&minus;</span></button>
              <output class="ks-bpm" aria-label="Tempo in beats per minute"><b>120</b> BPM</output>
              <button type="button" class="ks-step-button ks-bpm-up" aria-label="Faster" title="Faster"><span aria-hidden="true">+</span></button>
            </div>
          </div>

          <div class="ks-control ks-speed">
            <span class="ks-label">Speed</span>
            <div class="ks-segments" role="radiogroup" aria-label="Speed of the pattern">
              <button type="button" class="ks-segment" role="radio" aria-checked="false" data-speed="0">&frac12;x</button>
              <button type="button" class="ks-segment" role="radio" aria-checked="true" data-speed="1">1x</button>
              <button type="button" class="ks-segment" role="radio" aria-checked="false" data-speed="2">2x</button>
              <button type="button" class="ks-segment" role="radio" aria-checked="false" data-speed="3">4x</button>
            </div>
          </div>

          <div class="ks-control ks-depth">
            <div class="ks-label"><span>Depth</span><output class="ks-depth-value">100%</output></div>
            <input type="range" class="ks-slider ks-depth-input" min="0" max="100" step="1" value="100" aria-label="Depth: how much of the signal a cut removes" />
          </div>

          <div class="ks-control ks-edge">
            <div class="ks-label"><span>Edge</span><output class="ks-edge-value">1.5 ms</output></div>
            <input type="range" class="ks-slider ks-edge-input" min="0" max="1000" step="1" value="511" aria-label="Edge: how long a cut takes to open and close" />
          </div>
        </div>
      </div>

      <!-- MOD UI drives the footswitch (mod-role="bypass"): it is the bypass of the plugin. What is drawn follows
           the class is-bypassed of .kill-switch, which the script sets from the port ':bypass' -->
      <div class="ks-pedal">
        <span class="ks-led" aria-hidden="true"></span>
        <button type="button" class="ks-foot" mod-role="bypass" aria-label="Bypass" title="Bypass"><span class="ks-cap" aria-hidden="true"></span></button>
        <span class="ks-foot-label">Kill</span>
      </div>
    </div>

    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>

    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>

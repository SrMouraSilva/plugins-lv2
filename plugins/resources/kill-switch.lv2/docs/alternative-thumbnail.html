     An abstract picture of Kill Switch (a row of steps that pass or are cut, and a footswitch ring), 400x400, for
     internal use. Rendered to alternative-thumbnail.webp by tools/media/thumbnails.mjs -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card { position: relative; box-sizing: border-box; width: 400px; height: 400px; border-radius: 88px; overflow: hidden;
    background: radial-gradient(90% 70% at 15% 0%, rgba(255, 120, 90, 0.16), rgba(255, 120, 90, 0) 60%), linear-gradient(170deg, #2a1d19, #120d0b);
    box-shadow: inset 0 0 0 4px rgba(255, 235, 228, 0.08); }
  .steps { position: absolute; left: 44px; right: 44px; top: 70px; height: 70px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .steps i { border-radius: 12px; background: #33231f; }
  .steps i.on { background: #ff4a3d; box-shadow: 0 0 26px -2px #ff4a3d; }
  .ring { position: absolute; left: 112px; top: 170px; width: 176px; height: 176px; border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle at 50% 35%, #3a2b26, #130d0b); box-shadow: 0 0 0 7px #ff4a3d, 0 0 40px 2px rgba(255, 74, 61, .6), inset 0 6px 14px rgba(0, 0, 0, .7); }
  .cap { position: absolute; left: 28px; top: 28px; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%), repeating-conic-gradient(from 0deg, #8d7f7a 0 8deg, #b6a8a3 8deg 16deg);
    box-shadow: 0 8px 0 #3b2c28, 0 12px 16px rgba(0, 0, 0, .6); }
</style>
<div class="card">
  <div class="steps"><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i></div>
  <div class="ring"><div class="cap"></div></div>
</div>

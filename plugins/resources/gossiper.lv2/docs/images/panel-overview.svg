<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect x="10" y="10" width="460" height="780" rx="16" fill="#2E0A45" stroke="#4B1D73" stroke-width="2"/>

  <text x="240" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Gossiper</text>

  <!-- footswitches: 2 columns x 3 rows + 1 centered -->
  <g>
    <!-- FS1 (off) -->
    <circle cx="130" cy="120" r="32" fill="#666666"/>
    <text x="130" y="168" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 1</text>

    <!-- FS2 (on, yellow) -->
    <circle cx="350" cy="120" r="38" fill="none" stroke="#EDA100" stroke-width="6"/>
    <circle cx="350" cy="120" r="32" fill="#666666"/>
    <text x="350" y="168" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 2</text>

    <!-- FS3 (off) -->
    <circle cx="130" cy="230" r="32" fill="#666666"/>
    <text x="130" y="278" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 3</text>
    <line x1="90" y1="284" x2="170" y2="284" stroke="#E3B8FF" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- FS4 (off) -->
    <circle cx="350" cy="230" r="32" fill="#666666"/>
    <text x="350" y="278" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 4</text>

    <!-- FS5 (off) -->
    <circle cx="130" cy="340" r="32" fill="#666666"/>
    <text x="130" y="388" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 5</text>

    <!-- FS6 (off) -->
    <circle cx="350" cy="340" r="32" fill="#666666"/>
    <text x="350" y="388" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 6</text>

    <!-- FS7 (on, magenta), centered -->
    <circle cx="240" cy="450" r="38" fill="none" stroke="#D81BE0" stroke-width="6"/>
    <circle cx="240" cy="450" r="32" fill="#666666"/>
    <text x="240" y="498" text-anchor="middle" font-size="13" fill="#E3B8FF">Footswitch 7</text>
  </g>

  <!-- potentiometer rows -->
  <g font-size="12" fill="#FFFFFF">
    <text x="240" y="545" text-anchor="middle" font-weight="700">Pot 1</text>
    <rect x="70" y="555" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="135" y="572" text-anchor="middle" font-size="11">Min 0.00 v</text>
    <text x="240" y="572" text-anchor="middle" font-size="12" fill="#C9A6D6">—</text>
    <rect x="280" y="555" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="345" y="572" text-anchor="middle" font-size="11">Max 10.00 v</text>

    <text x="240" y="605" text-anchor="middle" font-weight="700">Pot 2</text>
    <rect x="70" y="615" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="135" y="632" text-anchor="middle" font-size="11">Min 0.00 v</text>
    <text x="240" y="632" text-anchor="middle" font-size="12" fill="#C9A6D6">—</text>
    <rect x="280" y="615" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="345" y="632" text-anchor="middle" font-size="11">Max 10.00 v</text>

    <text x="240" y="665" text-anchor="middle" font-weight="700">Pot 3</text>
    <rect x="70" y="675" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="135" y="692" text-anchor="middle" font-size="11">Min 0.04 v</text>
    <text x="240" y="692" text-anchor="middle" font-size="12" fill="#C9A6D6">—</text>
    <rect x="280" y="675" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="345" y="692" text-anchor="middle" font-size="11">Max 10.00 v</text>

    <text x="240" y="725" text-anchor="middle" font-weight="700">Pot 4</text>
    <rect x="70" y="735" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="135" y="752" text-anchor="middle" font-size="11">Min 0.00 v</text>
    <text x="240" y="752" text-anchor="middle" font-size="12" fill="#C9A6D6">—</text>
    <rect x="280" y="735" width="130" height="26" rx="4" fill="#5A3766" stroke="#7A4E8C"/>
    <text x="345" y="752" text-anchor="middle" font-size="11">Max 10.00 v</text>
  </g>

  <!-- callouts -->
  <g stroke="#FFD400" stroke-width="2" fill="none">
    <line x1="392" y1="95" x2="378" y2="108"/>
    <line x1="90" y1="284" x2="65" y2="270"/>
    <line x1="90" y1="560" x2="65" y2="525"/>
  </g>
  <g font-size="14" font-weight="700" fill="#02094E" text-anchor="middle">
    <circle cx="404" cy="88" r="15" fill="#FFD400" stroke="#2E0A45" stroke-width="2"/>
    <text x="404" y="93">A</text>

    <circle cx="55" cy="260" r="15" fill="#FFD400" stroke="#2E0A45" stroke-width="2"/>
    <text x="55" y="265">B</text>

    <circle cx="52" cy="512" r="15" fill="#FFD400" stroke="#2E0A45" stroke-width="2"/>
    <text x="52" y="517">C</text>
  </g>
</svg>

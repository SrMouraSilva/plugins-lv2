     An abstract picture of Gossiper (the last control used, 7 footswitch indicators, 4 potentiometer meters),
     400x400, for internal use. Rendered to alternative-thumbnail.png by tools/media/thumbnails.mjs -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card { position: relative; box-sizing: border-box; width: 400px; height: 400px; border-radius: 88px; overflow: hidden;
    background: radial-gradient(90% 70% at 15% 0%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 60%), linear-gradient(170deg, #232834, #14171d);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.07); }
  .display { position: absolute; left: 44px; right: 44px; top: 62px; height: 104px; border-radius: 30px; background: #0b0e13; box-shadow: inset 0 0 0 3px #2a303c; }
  .badge { position: absolute; left: 18px; top: 18px; width: 68px; height: 68px; border-radius: 20px; background: #ffff67; box-shadow: 0 0 26px -2px #ffff67; }
  .line1 { position: absolute; left: 104px; top: 30px; width: 120px; height: 14px; border-radius: 7px; background: rgba(238, 241, 246, .9); }
  .line2 { position: absolute; left: 104px; top: 56px; width: 70px; height: 10px; border-radius: 5px; background: #98a2b3; }
  .pill { position: absolute; right: 22px; top: 34px; width: 62px; height: 36px; border-radius: 18px; background: #ffff67; }
  .dots { position: absolute; left: 44px; right: 44px; top: 198px; display: flex; justify-content: space-between; }
  .dots i { width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 5px solid var(--c); opacity: .5; }
  .dots i.on { background: var(--c); opacity: 1; box-shadow: 0 0 20px 1px var(--c); }
  .meters { position: absolute; left: 44px; right: 44px; top: 266px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .meter { height: 70px; border-radius: 18px; background: #1d222b; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .07); position: relative; }
  .meter::after { content: ""; position: absolute; left: 12px; bottom: 14px; height: 10px; border-radius: 5px; width: var(--w); background: #ffc861; }
  .meter::before { content: ""; position: absolute; left: 12px; right: 12px; bottom: 14px; height: 10px; border-radius: 5px; background: #0b0e13; }
  .meter::after { z-index: 1; }
</style>
<div class="card">
  <div class="display"><div class="badge"></div><div class="line1"></div><div class="line2"></div><div class="pill"></div></div>
  <div class="dots">
    <i style="--c:#ff6667"></i><i class="on" style="--c:#ffff67"></i><i style="--c:#66ffff"></i><i style="--c:#bb7cd2"></i><i style="--c:#f5a77e"></i><i style="--c:#66ff66"></i><i style="--c:#ff66ff"></i>
  </div>
  <div class="meters">
    <div class="meter" style="--w:18px"></div><div class="meter" style="--w:0px"></div><div class="meter" style="--w:48px"></div><div class="meter" style="--w:0px"></div>
  </div>
</div>

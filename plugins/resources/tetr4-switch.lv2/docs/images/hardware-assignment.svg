<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#02094E">Assigning parameters to hardware controls</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Lane 1: Preset 1-4 footswitches -->
  <g>
    <rect x="20" y="60" width="200" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <text x="120" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Preset 1 – Preset 4</text>
    <text x="120" y="104" text-anchor="middle" font-size="11" fill="#666666">(one footswitch each)</text>

    <line x1="220" y1="90" x2="345" y2="90" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <circle cx="380" cy="90" r="34" fill="#FFFFFF" stroke="#333333" stroke-width="3"/>
    <text x="380" y="95" text-anchor="middle" font-size="12" fill="#333333">footswitch</text>
    <circle cx="350" cy="60" r="6" fill="#E53935"/>
    <circle cx="410" cy="60" r="6" fill="#F2C200"/>
    <circle cx="350" cy="120" r="6" fill="#00ACC1"/>
    <circle cx="410" cy="120" r="6" fill="#D81BE0"/>

    <line x1="415" y1="90" x2="540" y2="90" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="560" y="60" width="300" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <circle cx="585" cy="90" r="8" fill="#F2C200"/>
    <text x="605" y="80" font-size="14" font-weight="600" fill="#02094E">LED lights in the preset's</text>
    <text x="605" y="97" font-size="14" font-weight="600" fill="#02094E">colour; label shows "2 - ON"</text>
  </g>

  <!-- Lane 2: Current preset -->
  <g>
    <rect x="20" y="185" width="200" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <text x="120" y="211" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Current preset</text>
    <text x="120" y="229" text-anchor="middle" font-size="11" fill="#666666">(the selector control)</text>

    <line x1="220" y1="215" x2="345" y2="215" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <circle cx="380" cy="215" r="34" fill="#FFFFFF" stroke="#333333" stroke-width="3"/>
    <line x1="380" y1="215" x2="380" y2="188" stroke="#333333" stroke-width="3"/>
    <text x="380" y="255" text-anchor="middle" font-size="12" fill="#333333">encoder / knob</text>

    <line x1="415" y1="215" x2="540" y2="215" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="560" y="185" width="300" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <circle cx="585" cy="215" r="8" fill="#00ACC1"/>
    <text x="605" y="205" font-size="14" font-weight="600" fill="#02094E">LED colour = active preset;</text>
    <text x="605" y="222" font-size="14" font-weight="600" fill="#02094E">label shows the preset number</text>
  </g>

  <!-- Lane 3: Assign to notify -->
  <g>
    <rect x="20" y="310" width="200" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <text x="120" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Assign to notify 1 – 4</text>
    <text x="120" y="354" text-anchor="middle" font-size="11" fill="#666666">(any assignable control)</text>

    <line x1="220" y1="340" x2="345" y2="340" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <circle cx="380" cy="340" r="34" fill="#FFFFFF" stroke="#333333" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="380" y="345" text-anchor="middle" font-size="11" fill="#333333">any control</text>

    <line x1="415" y1="340" x2="540" y2="340" stroke="#999999" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="560" y="310" width="300" height="60" rx="8" fill="#F4F4FA" stroke="#02094E"/>
    <path d="M580,325 h30 v14 l-8,-4 h-22 z" fill="#02094E"/>
    <text x="625" y="331" font-size="13" font-weight="600" fill="#02094E">Tetr4 switch</text>
    <text x="625" y="348" font-size="13" fill="#02094E">Solo</text>
    <text x="700" y="341" font-size="12" fill="#666666">pop-up shows the preset's</text>
    <text x="700" y="357" font-size="12" fill="#666666">custom label on screen</text>
  </g>
</svg>

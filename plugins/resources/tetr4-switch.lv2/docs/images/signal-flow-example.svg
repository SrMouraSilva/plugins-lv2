<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- Tetr4 Switch box -->
  <rect x="40" y="70" width="180" height="220" rx="10" fill="#02094E"/>
  <text x="130" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Tetr4</text>
  <text x="130" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">switch</text>

  <!-- output ports + wires + destinations -->
  <g font-size="13" fill="#333333">
    <!-- row helper: y = 90,150,210,270 -->
    <!-- CV Out 1 -> Distortion -->
    <circle cx="220" cy="90" r="5" fill="#02094E"/>
    <text x="232" y="85">CV Output 1</text>
    <line x1="220" y1="90" x2="620" y2="90" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="620" y="70" width="200" height="40" rx="6" fill="#F4F4FA" stroke="#02094E" stroke-width="1.5"/>
    <text x="720" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Distortion</text>

    <!-- CV Out 2 -> Chorus -->
    <circle cx="220" cy="150" r="5" fill="#02094E"/>
    <text x="232" y="145">CV Output 2</text>
    <line x1="220" y1="150" x2="620" y2="150" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="620" y="130" width="200" height="40" rx="6" fill="#F4F4FA" stroke="#02094E" stroke-width="1.5"/>
    <text x="720" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Chorus</text>

    <!-- CV Out 3 -> Delay -->
    <circle cx="220" cy="210" r="5" fill="#02094E"/>
    <text x="232" y="205">CV Output 3</text>
    <line x1="220" y1="210" x2="620" y2="210" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="620" y="190" width="200" height="40" rx="6" fill="#F4F4FA" stroke="#02094E" stroke-width="1.5"/>
    <text x="720" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Delay</text>

    <!-- CV Out 4 -> Reverb -->
    <circle cx="220" cy="270" r="5" fill="#02094E"/>
    <text x="232" y="265">CV Output 4</text>
    <line x1="220" y1="270" x2="620" y2="270" stroke="#999999" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="620" y="250" width="200" height="40" rx="6" fill="#F4F4FA" stroke="#02094E" stroke-width="1.5"/>
    <text x="720" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#02094E">Reverb</text>
  </g>

  <text x="720" y="45" text-anchor="middle" font-size="13" fill="#666666">plugin's "Enabled" / bypass parameter,</text>
  <text x="720" y="60" text-anchor="middle" font-size="13" fill="#666666">addressed to the matching CV output</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- truth table -->
  <text x="450" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#02094E">Which preset turns on which effect</text>

  <g stroke="#CCCCCC" stroke-width="1">
    <!-- horizontal lines -->
    <line x1="100" y1="340" x2="800" y2="340"/>
    <line x1="100" y1="380" x2="800" y2="380"/>
    <line x1="100" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="460" x2="800" y2="460"/>
    <line x1="100" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="540" x2="800" y2="540"/>
    <!-- vertical lines -->
    <line x1="100" y1="340" x2="100" y2="540"/>
    <line x1="260" y1="340" x2="260" y2="540"/>
    <line x1="395" y1="340" x2="395" y2="540"/>
    <line x1="530" y1="340" x2="530" y2="540"/>
    <line x1="665" y1="340" x2="665" y2="540"/>
    <line x1="800" y1="340" x2="800" y2="540"/>
  </g>

  <g font-size="14" font-weight="700" fill="#02094E" text-anchor="middle">
    <text x="180" y="365">Preset</text>
    <text x="327" y="365">Distortion</text>
    <text x="462" y="365">Chorus</text>
    <text x="597" y="365">Delay</text>
    <text x="732" y="365">Reverb</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="180" y="405">1 · Clean</text>
    <text x="180" y="445">2 · Crunch</text>
    <text x="180" y="485">3 · Ambient</text>
    <text x="180" y="525">4 · Solo</text>
  </g>

  <!-- marks: filled = ON, outline = OFF -->
  <g>
    <!-- Clean: all off -->
    <circle cx="327" cy="397" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="462" cy="397" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="597" cy="397" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="732" cy="397" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>

    <!-- Crunch: distortion on -->
    <circle cx="327" cy="437" r="9" fill="#02094E"/>
    <circle cx="462" cy="437" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="597" cy="437" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="732" cy="437" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>

    <!-- Ambient: chorus, delay, reverb on -->
    <circle cx="327" cy="477" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="462" cy="477" r="9" fill="#02094E"/>
    <circle cx="597" cy="477" r="9" fill="#02094E"/>
    <circle cx="732" cy="477" r="9" fill="#02094E"/>

    <!-- Solo: delay, reverb on -->
    <circle cx="327" cy="517" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="462" cy="517" r="9" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <circle cx="597" cy="517" r="9" fill="#02094E"/>
    <circle cx="732" cy="517" r="9" fill="#02094E"/>
  </g>
</svg>

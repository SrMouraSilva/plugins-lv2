     An abstract picture of Half Mouco (a row of steps for each side, blue and amber, and a footswitch ring), 400x400, for
     internal use. Rendered to alternative-thumbnail.webp by tools/media/thumbnails.mjs -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card { position: relative; box-sizing: border-box; width: 400px; height: 400px; border-radius: 88px; overflow: hidden;
    background: radial-gradient(90% 70% at 15% 0%, rgba(90, 230, 210, 0.16), rgba(90, 230, 210, 0) 60%), linear-gradient(170deg, #16282a, #0a1315);
    box-shadow: inset 0 0 0 4px rgba(220, 248, 244, 0.08); }
  .lane { position: absolute; left: 44px; right: 44px; height: 50px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .lane.l { top: 62px; --c: #3ec9ff; }
  .lane.r { top: 122px; --c: #ffb347; }
  .lane i { border-radius: 12px; background: #1c2d2d; }
  .lane i.on { background: var(--c); box-shadow: 0 0 24px -2px var(--c); }
  .ring { position: absolute; left: 122px; top: 204px; width: 156px; height: 156px; border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle at 50% 35%, #27403f, #0b1516); box-shadow: 0 0 0 7px #4fe0c5, 0 0 40px 2px rgba(79, 224, 197, .55), inset 0 6px 14px rgba(0, 0, 0, .7); }
  .cap { position: absolute; left: 24px; top: 24px; width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%), repeating-conic-gradient(from 0deg, #7d8b89 0 8deg, #a9b8b6 8deg 16deg);
    box-shadow: 0 8px 0 #1d3636, 0 12px 16px rgba(0, 0, 0, .6); }
</style>
<div class="card">
  <div class="lane l"><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i></div>
  <div class="lane r"><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i></div>
  <div class="ring"><div class="cap"></div></div>
</div>
